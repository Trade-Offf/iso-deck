<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一次下单经过哪些系统 · 动态图解</title>
  <link rel="stylesheet" href="../../engine/iso.css" />
</head>
<body>
  <div id="app"></div>

  <script src="../../engine/iso-stage.js"></script>
  <script src="../../engine/iso-deck.js"></script>
  <script>
    // 系统讲解示例：给新同事讲清楚一次下单经过哪些服务、哪里会出问题。
    // 一份流程模型，多页故事：每页只说“高亮谁、讲什么”，坐标只写一次。
    const { block, db, crowd, zone, link, hot, down } = Iso.h;

    const model = {
      entities: {
        edge: zone({ x0: -16, x1: 8, y0: -6, y1: 6 }, '接入层', { tint: 'blue' }),
        core: zone({ x0: 10, x1: 31, y0: -17, y1: 14 }, '交易核心', { tint: 'orange' }),
        async: zone({ x0: 33, x1: 48, y0: -6, y1: 6 }, '异步', { tint: 'green' }),
        users: crowd({ x0: -14, x1: -8, y0: -3, y1: 3 }, 10, '用户 · App / 小程序'),
        gw: block(3, 0, { color: 'blue', glyph: 'shield', label: ['网关'], sub: '鉴权 · 限流' }),
        order: block(18, 0, { color: 'orange', glyph: 'server', label: ['订单服务'] }),
        orders: db(14, -12, { r: 1.7, h: 28, color: 'purple', glyph: 'database', label: '订单库' }),
        stock: block(29, -8, { s: 3.4, color: 'yellow', glyph: 'layers', label: ['库存'], pills: 'below' }),
        pay: block(25, 9, { s: 3.4, color: 'green', glyph: 'zap', label: ['支付'] }),
        mq: db(37, 0, { r: 1.6, h: 22, color: 'gray', glyph: 'message', label: '消息队列' }),
        notify: block(43, 0, { s: 3.2, color: 'blue', glyph: 'message', label: ['通知'], sub: '短信 · 推送' }),
      },
      links: {
        ug: link('users', 'gw', { label: '下单' }),
        go: link('gw', 'order'),
        od: link('order', 'orders', { label: '写订单' }),
        os: link('order', 'stock', { label: '锁库存' }),
        op: link('order', 'pay', { label: '发起支付' }),
        om: link('order', 'mq', { label: '下单成功' }),
        mn: link('mq', 'notify'),
      },
    };

    const facts = {
      peak: { value: '1,200 单/分钟', source: '示例数据：大促峰值' },
      timeout: { value: '30 秒', source: '示例配置：支付回调超时' },
      retry: { value: '3 次', source: '示例配置：消息重试次数' },
      lock: { value: '15 分钟', source: '示例配置：未支付订单的库存锁定时长' },
    };

    const ALL = Object.keys(model.entities);
    const LINKS = Object.keys(model.links);

    IsoDeck.mount('#app', {
      title: '一次下单经过哪些系统',
      subtitle: '新人入职 · 系统导览',
      icon: 'layers',
      model,
      facts,
      legend: ['req', 'write', 'push', 'fail'],
      steps: [
        {
          short: '开场',
          title: '一次下单，经过 6 个系统',
          side: false,
          legend: [],
          cover: {
            layout: 'split',
            kicker: '新人入职 · 系统导览',
            title: '一次下单，<br>经过<em>哪些系统</em>',
            subtitle: '先看全景，再走一遍正常下单，<br>最后看两个最常见的故障。',
            agenda: ['全景', '正常下单', '库存不足', '支付超时', '大促高峰'],
          },
          notes: ['今天带大家认识下单链路：一次下单从用户点按钮开始，经过哪些系统，哪里最容易出问题。'],
          scene: { entities: ALL, links: LINKS, camera: { at: [-2, -20], zoom: 0.8 } },
        },
        {
          short: '全景',
          badge: '全景',
          title: '三块：接入层、交易核心、异步',
          body: ['请求先过**网关**，再到**订单服务**。订单服务负责协调库存和支付，成功之后把消息丢进**队列**，由通知服务异步发短信和推送。'],
          notes: ['整个链路分三块。我们按请求走的顺序，一块一块看。'],
          beats: [
            { say: '最左边是接入层：用户的请求先到网关，网关做鉴权和限流。', focus: ['users', 'gw'], card: { title: '接入层', icon: 'shield', lines: ['鉴权：你是谁', '限流：挡住突发流量'] } },
            { say: '中间是交易核心：订单服务写订单，同时锁库存、发起支付。', focus: ['order', 'orders', 'stock', 'pay'], zoom: 1.2, card: { title: '交易核心', icon: 'server', lines: ['写订单', '锁库存（{lock}）', '发起支付'] } },
            { say: '右边是异步部分：下单成功的消息进队列，通知服务慢慢发。', focus: ['mq', 'notify'], card: { title: '异步', icon: 'message', lines: ['队列削峰', '失败重试 {retry}'] } },
            { say: '这就是全景，下面走一遍正常下单。' },
          ],
          scene: { entities: ALL, links: LINKS },
        },
        {
          short: '正常下单',
          badge: '主流程',
          title: '正常下单：一条请求走完全程',
          body: ['网关 → 订单服务 → 锁库存 → 支付 → 写订单 → 发消息 → 通知用户。'],
          notes: ['看一次正常的下单。请求从左往右走，最后用户收到通知。'],
          scene: {
            entities: ALL,
            links: LINKS,
            flows: [
              { route: ['ug', 'go'], rate: 2, kind: 'req' },
              { route: ['os'], rate: 1.4, kind: 'req' },
              { route: ['op'], rate: 1.4, kind: 'req' },
              { route: ['od'], rate: 1.4, kind: 'write' },
              { route: ['om', 'mn'], rate: 1.4, kind: 'push' },
            ],
            card: { title: '一次下单', icon: 'zap', lines: ['① 网关鉴权', '② 锁库存', '③ 支付', '④ 写订单', '⑤ 异步通知'] },
          },
        },
        {
          short: '库存不足',
          badge: '故障 ①',
          title: '库存不足：在锁库存这一步就返回',
          body: ['锁不到库存，订单服务直接告诉用户“已售罄”，**不会**去发起支付。'],
          callout: { kind: 'tip', text: '先锁库存再支付，避免“付了钱却没货”。' },
          notes: ['第一个常见问题：库存不足。订单服务锁不到库存，就直接返回，不会走到支付。'],
          scene: {
            entities: { ...Object.fromEntries(ALL.map((k) => [k, true])), stock: { tags: [{ text: '已售罄', tone: 'red', icon: 'alert' }] }, pay: { dim: 1 }, mq: { dim: 1 }, notify: { dim: 1 } },
            links: { ug: true, go: true, os: true, od: true, op: { style: 'muted' }, om: { style: 'muted' }, mn: { style: 'muted' } },
            flows: [
              { route: ['ug', 'go'], rate: 1.6, kind: 'req' },
              { route: ['os'], rate: 1.6, kind: 'fail' },
            ],
            card: { title: '库存不足', icon: 'alert', lines: ['锁库存失败', '→ 直接返回“已售罄”', '- 不发起支付'] },
          },
        },
        {
          short: '支付超时',
          badge: '故障 ②',
          title: '支付超时：{timeout} 没回调就关单',
          body: ['支付渠道 **{timeout}** 没有回调，订单服务把订单标成“待确认”。库存继续锁 **{lock}**，到期没付款就释放。'],
          notes: ['第二个常见问题：支付超时。支付渠道迟迟不回调，我们不能一直等。', '超过 {timeout} 就先把订单标成待确认，库存锁 {lock}，到期没付款就释放回去。'],
          scene: {
            entities: { ...Object.fromEntries(ALL.map((k) => [k, true])), pay: down('超时'), stock: { tags: [{ text: '锁定 {lock}', tone: 'orange', icon: 'clock' }] }, orders: { tags: [{ text: '待确认', tone: 'orange' }] } },
            links: LINKS,
            flows: [
              { route: ['op'], rate: 1.2, kind: 'fail' },
              { route: ['od'], rate: 1, kind: 'write' },
            ],
            card: { title: '支付超时', icon: 'clock', lines: ['{timeout} 无回调', '→ 订单标“待确认”', '→ 库存锁 {lock}', '= 到期未付自动释放'] },
          },
        },
        {
          short: '大促',
          badge: '高峰',
          title: '大促高峰：{peak}',
          body: ['高峰时网关先**限流**，订单服务压力最大。通知走队列，晚几秒发不影响下单。'],
          callout: { kind: 'insight', text: '能异步的都异步：队列把峰值摊平。' },
          notes: ['最后看大促。峰值大约 {peak}，网关先限流，订单服务最忙；通知走队列，晚几秒发出去也没关系。'],
          scene: {
            entities: {
              ...Object.fromEntries(ALL.map((k) => [k, true])),
              users: crowd({ x0: -14, x1: -8, y0: -3, y1: 3 }, 24, '用户 · 大促'),
              gw: { tags: [{ text: '限流', tone: 'orange', icon: 'shield' }] },
              order: { ...hot(0.92), tags: [{ text: '{peak}', tone: 'red', icon: 'zap' }] },
              mq: { tags: [{ text: '排队削峰', tone: 'green' }] },
            },
            links: LINKS,
            flows: [
              { route: ['ug', 'go'], rate: 5, kind: 'req' },
              { route: ['od'], rate: 3, kind: 'write' },
              { route: ['om', 'mn'], rate: 1.2, kind: 'push' },
            ],
            card: { title: '高峰怎么扛', icon: 'trendingUp', lines: ['网关限流', '订单服务扩容', '通知异步，削峰'] },
          },
        },
        {
          short: '总结',
          badge: '总结',
          title: '记住三件事',
          body: ['**先锁库存再支付**，避免超卖。', '**支付超时不硬等**，标待确认、到期释放。', '**能异步的都异步**，队列削峰。'],
          notes: ['总结三件事：先锁库存再支付；支付超时不硬等；能异步的都异步。有问题随时找我。'],
          scene: {
            entities: ALL,
            links: LINKS,
            flows: [{ route: ['ug', 'go'], rate: 1.6, kind: 'req' }, { route: ['om', 'mn'], rate: 1.2, kind: 'push' }],
          },
        },
      ],
    });
  </script>
</body>
</html>
