<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 翻译提效 · 动态图解</title>
  <link rel="stylesheet" href="../../engine/iso.css" />
</head>
<body>
  <div id="app"></div>

  <script src="../../engine/iso-stage.js"></script>
  <script src="../../engine/iso-deck.js"></script>
  <script>
    const { block, db, crowd, zone, note, link, hot } = Iso.h;

    /* ================= 流程模型：画面里有什么、谁连着谁（每页只按 id 引用） ================= */
    // 平台主线沿 +y（屏幕右上）：开发 → key 表 → 测试 → 预发 → 正式 → 用户
    // 平台外支线沿 +x（屏幕右下）：产品 → 翻译负责人 → 译员 / Excel → 回填
    const TMS = { x0: -25, x1: 6, y0: -20.5, y1: -3 };
    const OUT = { x0: 11, x1: 32, y0: -19, y1: 1 };

    const E = {
      dev: (o) => block(2, -30, { color: 'blue', glyph: 'code', label: ['开发'], sub: '定义 key', ...o }),
      tms: (o) => zone(TMS, 'TMS 多语言平台', { tint: 'blue', ...o }),
      keys: (o) => db(2, -10, { r: 1.9, h: 34, color: 'purple', glyph: 'database', label: 'key 表', ...o }),
      pm: (o) => block(16, -30, { color: 'orange', glyph: 'user', label: ['产品'], sub: '提需求', ...o }),
      out: (o) => zone(OUT, '平台外', { ...o }),
      lead: (o) => block(16, -14, { color: 'yellow', glyph: 'users', label: ['翻译', '负责人'], ...o }),
      staff: (o) => crowd({ x0: 24, x1: 30, y0: -17, y1: -11 }, 8, '全职 / 兼职译员', o),
      excel: (o) => block(16, -3, { s: 3, h: 22, color: 'green', glyph: 'file', label: ['Excel'], ...o }),
      test: (o) => block(2, 4, { s: 3, h: 28, color: 'gray', glyph: 'monitor', label: ['测试'], ...o }),
      staging: (o) => block(2, 10, { s: 3, h: 28, color: 'gray', glyph: 'layers', label: ['预发'], ...o }),
      prod: (o) => block(2, 16, { s: 3, h: 28, color: 'blue', glyph: 'rocket', label: ['正式'], ...o }),
      users: (o) => crowd({ x0: -2, x1: 6, y0: 21, y1: 28 }, 14, '多国用户 · 切换母语', o),
      ai: (o) => block(-11, -10, { s: 3.4, h: 34, color: 'green', glyph: 'bot', label: ['AI 翻译'], sub: 'DeepSeek', ...o }),
      gloss: (o) => db(-21.5, -10.5, { r: 1.4, h: 22, color: 'orange', glyph: 'file', label: '术语表', ...o }),
      prompt: (o) => db(-14.5, -17.5, { r: 1.4, h: 22, color: 'yellow', glyph: 'message', label: '角色提示词', ...o }),
      check: (o) => block(-4.5, -10, { s: 2.8, h: 20, color: 'orange', glyph: 'shield', label: ['校验'], ...o }),
    };

    // 请求走 y-3.5 的“上车道”，写回走 y 轴主线，两条线不重叠
    const LANE = ['keys', ['keys', 'keys-3.5'], ['ai', 'keys-3.5'], 'ai'];
    const L = {
      dk: (o) => link('dev', 'keys', { label: '定义 key', labelAt: 0.4, ...o }),
      pr: (o) => link('pm', 'lead', { label: '请翻译这批 key', ...o }),
      ls: (o) => link('lead', 'staff', { heads: 'both', label: '拆语言 · 催进度', ...o }),
      le: (o) => link('lead', 'excel', { label: '从零翻译', ...o }),
      bf: (o) => link('excel', 'keys', ['excel', ['keys', 'excel'], 'keys'], { style: 'dashed', label: '回填 · @产品', labelAt: 0.35, ...o }),
      p1: (o) => link('keys', 'test', { label: '发布', ...o }),
      p2: (o) => link('test', 'staging', o),
      p3: (o) => link('staging', 'prod', o),
      p4: (o) => link('prod', 'users', o),
      rv: (o) => link('keys', 'lead', ['keys', ['lead', 'keys'], 'lead'], { heads: 'both', label: '审核', labelAt: 0.6, ...o }),
      ka: (o) => link('keys', 'ai', LANE, { label: '只翻空格 · ≤ {batch}', labelAt: 0.45, ...o }),
      ga: (o) => link('gloss', 'ai', o),
      pa: (o) => link('prompt', 'ai', o),
      ak: (o) => link('ai', 'keys', ['ai', 'keys'], { label: '写回', ...o }),
      ac: (o) => link('ai', 'check', o),
      ck: (o) => link('check', 'keys', o),
    };
    const pick = (names, opt = {}) => Object.fromEntries(names.map((n) => [n, opt[n] || true]));
    const MUTED = { style: 'muted' };
    const muteAll = (names) => Object.fromEntries(names.map((n) => [n, MUTED]));
    const MODEL = {
      entities: Object.fromEntries(Object.entries(E).map(([k, f]) => [k, f()])),
      links: Object.fromEntries(Object.entries(L).map(([k, f]) => [k, f()])),
    };

    const DIM = { dim: 1 };
    const OLD = ['dev', 'tms', 'keys', 'pm', 'out', 'lead', 'staff', 'excel', 'test', 'staging', 'prod', 'users'];
    const OLD_LINKS = ['dk', 'pr', 'ls', 'le', 'bf', 'p1', 'p2', 'p3', 'p4'];
    const NEW = ['dev', 'tms', 'keys', 'pm', 'out', 'lead', 'gloss', 'prompt', 'ai', 'check', 'test', 'staging', 'prod', 'users'];
    const NEW_LINKS = ['dk', 'pr', 'rv', 'ka', 'ga', 'pa', 'ac', 'ck', 'p1', 'p2', 'p3', 'p4'];
    const REVIEWER = { label: ['翻译', '同事'], sub: '审核' };

    /* key 的多语言扇出 */
    const LANGS = [
      ['zh-CN', '确认'], ['en-US', 'Confirm'], ['ja-JP', '確認'], ['ko-KR', '확인'], ['th-TH', 'ยืนยัน'], ['vi-VN', 'Xác nhận'],
      ['es-ES', 'Confirmar'], ['fr-FR', 'Confirmer'], ['de-DE', 'Bestätigen'], ['ru-RU', 'Подтвердить'], ['tr-TR', 'Onayla'], ['id-ID', 'Konfirmasi'],
    ];
    const fanout = () => {
      const entities = { key: block(0, 0, { s: 4.2, h: 40, color: 'yellow', glyph: 'key', label: ['确认'], sub: 'btn.confirm' }) };
      const links = {};
      const flows = [];
      LANGS.forEach(([code, text], i) => {
        const a = (i / LANGS.length) * Math.PI * 2 - Math.PI / 2;
        entities[`n${i}`] = note(Math.cos(a) * 12.5, Math.sin(a) * 12.5, `${code}  ${text}`, { tone: i === 0 ? 'dark' : 'paper' });
        links[`l${i}`] = link('key', `n${i}`, { style: 'muted' });
        flows.push({ route: [`l${i}`], rate: 0.5, kind: 'push' });
      });
      return { entities, links, flows };
    };

    /* 结果页用的“等距柱状图” */
    const bar = (x, y, h, o) => block(x, y, { s: 3.2, h, radius: 7, glyph: '', ...o });

    /* ================= 数字台账：页面上的每个数字都从这里取，写明出处 ================= */
    // 公开示例：数字为示意值，不是真实业务口径
    const FACTS = {
      langs: { value: '10+', source: '示例数据：平台已上线的语言数' },
      groups: { value: '3 个组', source: '示例数据：接入平台的业务组' },
      projects: { value: '3–5 个项目', source: '示例数据：每组同时推进的项目数' },
      batch: { value: '50 条', source: '工作流配置：单次最多翻译条数' },
      retry: { value: '1 次', source: '工作流配置：校验失败的重试次数' },
      wait_old: { value: '0.5–1 天', source: '示例数据：翻译负责人估算的单项目等待' },
      wait_new: { value: '≈ 0', source: '示例数据：AI 翻完 50 条约 1 分钟' },
      cost_old: { value: '¥1.2', source: '示例数据：现有翻译工具套餐按实际用量折算，每百条' },
      cost_new: { value: '¥0.1', source: '示例数据：轻量模型按量计费，每百条' },
      cost_ratio: { value: '12 倍', source: '计算：cost_old ÷ cost_new' },
      cost_flagship: { value: '$3–5', source: '示例数据：同一批内容用旗舰模型估算，每百条' },
      q_raw: { value: '60 分', source: '示例数据：直接用 AI 翻译的抽样评分' },
      q_gloss: { value: '70 分', source: '示例数据：加术语表后的抽样评分' },
      q_role: { value: '80 分', source: '示例数据：再加角色提示词后的抽样评分' },
      q_human: { value: '100 分', source: '评分基准：翻译同事的译文记为 100 分' },
      q_test: { value: '87 分', source: '示例数据：30 条逐条对比打分的平均分' },
      q_target: { value: '85 分', source: '目标：大批量生产时的稳定分数' },
      sample: { value: '30 条', source: '示例数据：抽样对比的条数' },
      worse: { value: '8 条', source: '示例数据：30 条里同事译文更好的条数' },
      even: { value: '22 条', source: '计算：sample − worse' },
    };

    /* ================= 故事：每页高亮哪一段、讲什么 ================= */
    const deck = {
      title: 'AI 翻译提效',
      subtitle: '多语言翻译链路 · 向上汇报',
      icon: 'globe',
      legend: ['req', 'push', 'write', 'fail'],
      metricsBar: false, // 指标条只在总结页出现
      model: MODEL,
      facts: FACTS,
      metrics: [
        { key: 'cost', label: '每百条成本', icon: 'chart' },
        { key: 'wait', label: '翻译等待 / 项目', icon: 'clock' },
        { key: 'quality', label: '质量分', icon: 'target' },
        { key: 'langs', label: '覆盖语言', icon: 'globe' },
      ],
      steps: [
        /* ---------------- A. 业务流程 ---------------- */
        {
          short: '开场',
          title: '把翻译链路里的一个环节交给 AI',
          side: false,
          legend: [],
          cover: {
            layout: 'split',
            kicker: '多语言翻译流程 · AI 提效汇报',
            title: '翻译成本<em>降一个数量级</em>，<br>项目不再等翻译',
            subtitle: '把“人工从零翻译”换成“AI 先翻、人工审核”。<br>开发、产品、发布的流程都不变。',
            stats: [
              { label: '每百条翻译成本', value: '{cost_new}', from: '原来 {cost_old}' },
              { label: '每个项目等翻译', value: '{wait_new}', unit: '天', from: '原来 {wait_old}' },
              { label: '译文质量', value: '{q_test}', from: '人工译文为 {q_human}' },
            ],
            agenda: ['现在的流程', '改哪一段', '怎么改', '效果如何'],
          },
          metrics: { cost: '?', wait: '?', quality: '?', langs: '{langs}' },
          notes: ['大家好，接下来用 10 到 15 分钟介绍一件事：在现有的翻译流程里，把其中一个环节交给 AI，做一次提效。', '先讲背景，再讲我们改了哪里、效果怎么样。'],
          scene: { ...fanout(), camera: { at: [-11.4, -11.4], zoom: 1.25 } },
        },
        {
          short: 'key',
          badge: '背景',
          title: '一个 key，对应十几种语言',
          body: [
            '页面上的每一段文字，开发都会给它定一个锚点，叫 **key**。',
            '比如“确认”按钮，它的 key 下面挂着中文、英文、日语、韩语、泰语……**十几种语言**。不同国家的用户，看到的都是自己的母语。',
          ],
          callout: { kind: 'insight', text: '语言把人隔开，key + 多语言平台就是我们的“小巴别塔”。' },
          notes: [
            '页面上的每一段文字，开发都会给它定一个锚点，我们叫它 key。比如一个“确认”按钮，它的 key 下面挂着中文“确认”、英文“Confirm”，还有日语、韩语、泰语……十几种语言。',
            '语言是把人隔开的一把刀，而 key 加上多语言平台，就是我们的“小巴别塔”。',
          ],
          scene: {
            ...fanout(),
            card: { title: 'key 是什么', icon: 'key', corner: 'auto', lines: ['一个 key = 页面上的一段文字', '下面挂着 **{langs} 种语言** 的译文', '= 用户切换语言，看到自己的母语'] },
          },
        },
        {
          short: '开发',
          badge: '流程 ①',
          title: '开发：定义 key 和示例文字',
          body: ['链路的第一步在开发：根据需求文档，在页面上定好 **key**，并写好**示例文字**——这个按钮本来应该显示什么。', 'key 存在 **TMS 多语言平台** 的 key 表里。'],
          changes: ['+ 开发定义 key', '+ TMS 平台 · key 表'],
          notes: ['链路的第一步在开发。开发根据需求文档，在页面上定好 key，并写好示例文字，也就是这个按钮原本应该显示什么。'],
          scene: {
            entities: pick(['dev', 'tms', 'keys']),
            links: pick(['dk']),
            flows: [{ route: ['dk'], rate: 1.2, kind: 'write' }],
            card: { title: 'key 表', icon: 'database', lines: ['btn.confirm → “确认”', 'btn.cancel  → “取消”', '# 其他十几种语言：还是空的'] },
          },
        },
        {
          short: '产品',
          badge: '流程 ②',
          title: '产品：向翻译侧提需求',
          body: ['第二步，产品确认文案后，向翻译侧提需求：“这批 key 请帮忙翻译。”', '接需求的是**翻译负责人**——一个人对接平台所有项目。'],
          changes: ['+ 产品提翻译需求', '+ 翻译负责人'],
          notes: ['第二步，产品确认文案后，向翻译侧的同事提需求：“这批 key 请帮忙翻译。”'],
          scene: {
            entities: pick(['dev', 'tms', 'keys', 'pm', 'lead']),
            links: pick(['dk', 'pr']),
            flows: [{ route: ['pr'], rate: 1.2, kind: 'msg' }],
            card: { title: '翻译需求', icon: 'message', lines: ['产品 → 翻译负责人', '“这批 key 请帮忙翻译”', '# 通过 IM / 文档沟通，在平台外'] },
          },
        },
        {
          short: '翻译',
          badge: '流程 ③',
          title: '翻译：平台外，从零开始',
          body: ['第三步，翻译负责人把十几种语言拆给手下的**全职、兼职译员**。', '大家在平台外、在 **Excel** 里从零开始逐条翻译，负责人还要一个个去催进度。'],
          changes: ['+ 全职 / 兼职译员', '+ Excel 里逐条翻译'],
          notes: ['第三步，翻译负责人收到需求，把十几种语言拆给手下的全职、兼职译员。大家在平台外、在 Excel 里从零开始逐条翻译。'],
          scene: {
            entities: pick(['dev', 'tms', 'keys', 'pm', 'out', 'lead', 'staff', 'excel']),
            links: pick(['dk', 'pr', 'ls', 'le']),
            flows: [
              { route: ['pr'], rate: 1, kind: 'msg' },
              { route: ['ls'], rate: 2, kind: 'msg', bounce: true },
              { route: ['le'], rate: 1.2, kind: 'write' },
            ],
            card: { title: '人工翻译', icon: 'users', lines: ['1 位负责人 + 多位全职 / 兼职译员', '按语言拆分，各自在 Excel 里翻', '~ 进度靠人催'] },
          },
        },
        {
          short: '回填',
          badge: '流程 ④',
          title: '回填到平台，再 @ 产品',
          body: ['第四步，翻译完成后，Excel 里的结果要**回填**到 TMS 平台，再 @ 产品：“好了，可以用了。”'],
          changes: ['+ Excel → 平台回填', '+ @ 产品确认'],
          notes: ['第四步，翻译完成后，结果要再回填到 TMS 多语言平台里，然后 @ 产品：“好了，可以用了。”'],
          scene: {
            entities: pick(['dev', 'tms', 'keys', 'pm', 'out', 'lead', 'staff', 'excel']),
            links: pick(['dk', 'pr', 'ls', 'le', 'bf']),
            flows: [
              { route: ['ls'], rate: 1.2, kind: 'msg', bounce: true },
              { route: ['le', 'bf'], rate: 1.6, kind: 'write' },
            ],
            card: { title: '回填', icon: 'file', lines: ['Excel → 复制回 TMS 平台', '逐个语言核对、粘贴', '= 平台里的 key 才有了译文'] },
          },
        },
        {
          short: '发布',
          badge: '流程 ⑤',
          title: '发布：测试 → 预发 → 正式',
          body: ['最后在平台里发布：先到**测试环境**，再到**预发环境**，最后到**正式环境**。', '上线后，各国用户切换语言，就能看到自己母语的界面。这就是完整的翻译链路。'],
          changes: ['+ 测试 → 预发 → 正式', '+ 多国用户'],
          notes: ['最后一步，在平台里发布：先到测试环境，再到预发环境，最后到正式环境。上线之后，各个国家的用户切换语言，就能看到自己母语的界面。', '这就是完整的翻译链路。'],
          scene: {
            entities: pick(OLD),
            links: pick(OLD_LINKS),
            flows: [
              { route: ['le', 'bf'], rate: 1, kind: 'write' },
              { route: ['p1', 'p2', 'p3', 'p4'], rate: 2.2, kind: 'push' },
            ],
            card: { title: '完整链路', icon: 'layers', lines: ['① 开发定义 key', '② 产品提需求', '③ 平台外人工翻译', '④ 回填平台', '⑤ 发布上线'] },
          },
        },

        /* ---------------- B. 我们优化哪一段 ---------------- */
        {
          short: '优化点',
          badge: '改哪里',
          title: '我们只动第 ③④ 步',
          body: [
            '开发、产品、发布都**不动**。我们只改中间这一段：**平台外从零翻译 + Excel 回填**。',
            '围绕这一段，回答三个问题：',
            '**成本**能不能更低？**速度**能不能更快？前两个降下来，**质量**能不能守住？',
          ],
          callout: { kind: 'tip', text: '改动范围小：上下游的人和流程都不需要重新适应。' },
          notes: ['这五步里，开发、产品、发布我们都没有动。我们只动中间这一段：平台外从零翻译，再用 Excel 回填。', '围绕这一段，我们想回答三个问题：成本能不能更低？速度能不能更快？前两个降下来的同时，质量能不能守住？'],
          scene: {
            entities: pick(OLD, {
              dev: DIM, tms: DIM, pm: DIM, test: DIM, staging: DIM, prod: DIM, users: DIM,
              out: { label: '优化范围', tint: 'red' },
              lead: { tags: [{ text: '③ 从零翻译', tone: 'red', icon: 'target' }] },
              excel: { tags: [{ text: '④ 回填', tone: 'red', icon: 'target' }] },
            }),
            links: pick(OLD_LINKS, muteAll(['dk', 'pr', 'p1', 'p2', 'p3', 'p4'])),
            flows: [{ route: ['ls'], rate: 1.6, kind: 'msg', bounce: true }, { route: ['le', 'bf'], rate: 1.6, kind: 'write' }],
            card: { title: '三个问题', icon: 'flag', lines: ['成本 能不能更低？', '速度 能不能更快？', '质量 能不能守住？'] },
          },
        },
        {
          short: '瓶颈',
          badge: '为什么慢',
          title: '瓶颈：一个人对接所有项目',
          body: [
            '平台分 **{groups}**，每组同时推进 **{projects}**，所有翻译需求都汇到翻译负责人这一个节点。',
            '需求一多就排队：优先级高的先翻，低的往后放，再去催译员。每个项目在这一段通常要等**半天到一天**。',
          ],
          callout: { kind: 'warn', text: '不是谁不努力，而是单点排队：需求越多，等得越久。' },
          metrics: { wait: '{wait_old}' },
          notes: ['为什么慢？关键在翻译负责人这一个节点。我们平台分三个组，每组同时推进 3 到 5 个项目，所有翻译需求都汇到他这里。', '需求一多就要排队：优先级高的先翻，低的往后放，再去催全职、兼职的译员。每个项目在这一段的等待，通常是半天到一天。'],
          scene: (() => {
            const entities = {
              pmA: block(9, -34, { h: 26, color: 'orange', glyph: 'user', label: ['A 组'], sub: '{projects}' }),
